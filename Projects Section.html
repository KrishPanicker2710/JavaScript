<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        body{
            background: #222;
            color: white;
        }
        .card {
            color: #000;
        }
        .card img {
            height: 150px;
            padding: 15px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-warning">My Projects</h1>
        <div class="row">
            <script>
                let projects = [
                    ["messaging.svg", "Messaging Web App"],
                    ["fitness.svg", "Fitness Web App"],
                    ["e_commerce_platform.svg", "E-Commerce Platform"],
                    ["music.svg", "Music Player"]
                ];
                projects.forEach(p => document.write(`
                    <div class = "col-4 mb-4">
                    <div class = "card">
                    <img src = "image_0.jpg{p[0]}"
                    <div class = "card-body">
                `))
            </script>
        </div>
    </div>
</body>
</html>
